<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Parisa Mostafavi — Decision Science for Customer, Marketing, and Ecommerce</title>
  <desc id="desc">A dark blue professional banner with an analytical decision flow from evidence to action.</desc>
  <defs>
